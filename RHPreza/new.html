<style>
    /* --- Сброс --- */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    html, body {
        width: 100%;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: Arial, sans-serif;
        background-color: #D5C9C6;
        transition: background-color 1.2s ease;
    }

    .slides-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
    }

    .slide {
        width: 100%;
        height: 100vh;          /* fallback */
        height: 100dvh;         /* динамическая высота для мобильных */
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
        background-color: #D5C9C6;
        transition: background-color 1.2s ease;

        opacity: 0;
        transform: scale(0.98);
        transition: opacity 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                    transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        will-change: opacity, transform;
    }
    .slide.visible {
        opacity: 1;
        transform: scale(1);
    }

    .slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;      /* по умолчанию для десктопов – заполнение */
        object-position: center;
        border-radius: 0;
        box-shadow: none;
        transition: opacity 0.8s ease-in-out;
        background-color: transparent;
    }

    /* --- Тёмная тема --- */
    body.dark-theme {
        background-color: #464342;
    }
    body.dark-theme .slide {
        background-color: #464342;
    }

    /* --- Кнопка-переключатель --- */
    .theme-toggle {
        position: fixed;
        top: 30px;
        left: 30px;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(0, 0, 0, 0.15);
        border-radius: 50px;
        padding: 8px 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .theme-toggle:hover {
        background: rgba(0, 0, 0, 0.18);
        transform: scale(1.03);
    }
    .toggle-track {
        position: relative;
        width: 80px;
        height: 36px;
        background: rgba(0, 0, 0, 0.1);
        border-radius: 50px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8px;
        transition: background 0.3s ease;
    }
    .toggle-icon {
        font-size: 18px;
        line-height: 1;
        user-select: none;
        z-index: 2;
        display: flex;
        align-items: center;
    }
    .toggle-icon svg {
        display: block;
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
    }
    .toggle-thumb {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 28px;
        height: 28px;
        background: #ffffff;
        border-radius: 50%;
        transition: transform 0.3s ease, background 0.3s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        z-index: 3;
    }
    body.dark-theme .theme-toggle {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.25);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    body.dark-theme .theme-toggle:hover {
        background: rgba(255, 255, 255, 0.25);
    }
    body.dark-theme .toggle-track {
        background: rgba(255, 255, 255, 0.2);
    }
    body.dark-theme .toggle-thumb {
        transform: translateX(44px);
    }

    /* Затухание при смене темы */
    body.theme-switching .slide img {
        opacity: 0 !important;
        transition: opacity 0.8s ease-in-out;
    }

    /* ==========================================================
       МОБИЛЬНЫЕ И ПЛАНШЕТЫ: показываем изображение целиком
       ========================================================== */
    @media (max-width: 1024px) {
        .slide img {
            object-fit: contain;       /* вписываем без обрезания */
        }
        /* Чтобы полосы (если они есть) были цветом фона */
        .slide {
            background-color: #D5C9C6;
        }
        body.dark-theme .slide {
            background-color: #464342;
        }
    }

    /* ==========================================================
       ДЕСКТОПЫ (> 1024px) – оставляем cover для заполнения
       ========================================================== */
    @media (min-width: 1025px) {
        .slide img {
            object-fit: cover;
        }
    }

    /* --- Адаптация кнопки для телефонов --- */
    @media (max-width: 767px) {
        .slide {
            height: 100vh;
            height: 100dvh;
        }
        .theme-toggle {
            top: 15px;
            left: 15px;
            padding: 6px 10px;
        }
        .toggle-track {
            width: 60px;
            height: 28px;
            padding: 0 6px;
        }
        .toggle-thumb {
            width: 20px;
            height: 20px;
            top: 4px;
            left: 4px;
        }
        body.dark-theme .toggle-thumb {
            transform: translateX(32px);
        }
        .toggle-icon {
            font-size: 14px;
        }
        .toggle-icon svg {
            width: 16px;
            height: 16px;
        }
    }

    @media (min-width: 768px) and (max-width: 1024px) {
        .theme-toggle {
            top: 25px;
            left: 25px;
        }
        .toggle-track {
            width: 70px;
            height: 32px;
        }
        .toggle-thumb {
            width: 24px;
            height: 24px;
            top: 4px;
            left: 4px;
        }
        body.dark-theme .toggle-thumb {
            transform: translateX(38px);
        }
    }
</style>
