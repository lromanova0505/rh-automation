<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Retail&Horeca — Автоматизация вашего бизнеса</title>
    <style>
        /* ... (все стили до #progress-bar без изменений) ... */

        /* --- Улучшенный индикатор прогресса --- */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 1%;                /* минимальная ширина, чтобы была видна */
            height: 8px;              /* толще */
            background: linear-gradient(90deg, #464342, #2c2c2c); /* градиент */
            z-index: 10000;
            transition: width 0.1s linear, background 0.8s ease, box-shadow 0.3s ease;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
            border-radius: 0 4px 4px 0;
            opacity: 0;               /* скрыта до первого скролла */
            animation: fadeInBar 0.5s ease forwards;
            animation-delay: 0.5s;    /* появится через 0.5 сек после загрузки */
        }
        body.dark-theme #progress-bar {
            background: linear-gradient(90deg, #D5C9C6, #b5a8a4);
            box-shadow: 0 2px 12px rgba(255,255,255,0.2);
        }

        @keyframes fadeInBar {
            to { opacity: 1; }
        }

        /* ... (остальные стили без изменений) ... */
    </style>
</head>
<body>
    <!-- Прогресс-бар -->
    <div id="progress-bar"></div>

    <!-- ... остальной код ... -->
</body>
</html>
