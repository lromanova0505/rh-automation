<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Retail&Horeca — Автоматизация вашего бизнеса</title>
    <!-- Фавикон -->
    <link rel="icon" href="logo-dark.png" type="image/png">
    <style>
        /* --- Сброс --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #D5C9C6;
            transition: background-color 0.8s ease;
        }

        /* --- Лоадер с логотипом --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #D5C9C6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-logo {
            width: 120px;
            height: auto;
            margin-bottom: 30px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .loader-logo.loaded {
            opacity: 1;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 5px solid rgba(0, 0, 0, 0.1);
            border-top-color: #464342;
            animation: spin 1s linear infinite;
        }

        body.dark-theme #loader {
            background-color: #464342;
        }
        body.dark-theme .loader-spinner {
            border-color: rgba(255, 255, 255, 0.1);
            border-top-color: #ffffff;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- Основные стили слайдов --- */
        .slides-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slide {
            width: 100%;
            height: 100vh;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            background-color: #D5C9C6;
            transition: background-color 0.8s ease;
            opacity: 0;
            transition: opacity 0.7s ease;
            will-change: opacity;
            margin: 0;
            padding: 0;
        }
        .slide.visible {
            opacity: 1;
        }

        .slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            border-radius: 0;
            box-shadow: none;
            transition: opacity 0.8s ease;
            background-color: transparent;
        }

        body.dark-theme .slide {
            background-color: #464342;
        }

        /* --- Кнопка переключения темы (с анимациями) --- */
        .theme-toggle {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 50px;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease, transform 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
        }
        body.dark-theme .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .theme-toggle.animating {
            animation: pulse 0.6s ease;
        }
        .theme-toggle.animating .toggle-track {
            animation: spin 0.6s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            30% { transform: scale(1.15); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toggle-track {
            position: relative;
            width: 80px;
            height: 36px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            transition: background 0.6s ease;
            transform-origin: center;
        }

        .toggle-icon {
            font-size: 18px;
            line-height: 1;
            user-select: none;
            z-index: 2;
            display: flex;
            align-items: center;
        }
        .toggle-icon svg {
            display: block;
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
        }
        .toggle-thumb {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 28px;
            height: 28px;
            background: #ffffff;
            border-radius: 50%;
            transition: transform 0.6s ease, background 0.6s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 3;
        }

        body.dark-theme .theme-toggle {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        body.dark-theme .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }
        body.dark-theme .toggle-track {
            background: rgba(255, 255, 255, 0.2);
        }
        body.dark-theme .toggle-thumb {
            transform: translateX(44px);
        }

        body.theme-switching .slide img {
            opacity: 0 !important;
            transition: opacity 0.8s ease;
        }

        /* ============================================================
           НОВЫЕ КНОПКИ: НАВЕРХ И СВЯЗАТЬСЯ (стеклянный стиль)
           ============================================================ */
        .action-buttons {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn-glass {
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 50px;
            padding: 10px 18px;
            color: #222;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            text-decoration: none;
            color: #222;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }
        body.dark-theme .btn-glass {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .btn-glass:hover {
            background: rgba(0, 0, 0, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
        }
        body.dark-theme .btn-glass:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .btn-glass.pulse-on-click {
            animation: pulse 0.6s ease;
        }

        /* Кнопка "Наверх" появляется только после прокрутки */
        #btnTop {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.3s ease;
            transform: scale(0.9);
        }
        #btnTop.visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        /* Модальное окно */
        #modalOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #modalOverlay.active {
            display: flex;
            opacity: 1;
        }
        #modalOverlay .modal-content {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 50px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            text-align: center;
        }
        #modalOverlay.active .modal-content {
            transform: scale(1);
            opacity: 1;
        }
        body.dark-theme .modal-content {
            background: rgba(40, 40, 40, 0.9);
            color: #fff;
        }
        .modal-content h2 {
            font-size: 26px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .modal-content p {
            font-size: 18px;
            margin-bottom: 16px;
        }
        .modal-content a {
            color: #464342;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        body.dark-theme .modal-content a {
            color: #D5C9C6;
        }
        .modal-content a:hover {
            color: #000;
        }
        .modal-content .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
            color: #222;
            transition: transform 0.2s;
        }
        body.dark-theme .modal-content .close-btn {
            color: #fff;
        }
        .modal-content .close-btn:hover {
            transform: rotate(90deg);
        }

        /* --- Адаптация для мобильных --- */
        @media (max-width: 480px) {
            .theme-toggle {
                top: 15px;
                left: 15px;
                padding: 5px 8px;
            }
            .toggle-track {
                width: 54px;
                height: 24px;
                padding: 0 4px;
            }
            .toggle-thumb {
                width: 16px;
                height: 16px;
                top: 4px;
                left: 4px;
            }
            body.dark-theme .toggle-thumb {
                transform: translateX(30px);
            }
            .toggle-icon {
                font-size: 12px;
            }
            .toggle-icon svg {
                width: 14px;
                height: 14px;
            }
            .theme-toggle:hover {
                transform: none;
                box-shadow: none;
            }
            .loader-logo {
                width: 80px;
            }
            .action-buttons {
                bottom: 15px;
                right: 15px;
                gap: 10px;
            }
            .btn-glass {
                padding: 8px 14px;
                font-size: 14px;
                border-radius: 30px;
            }
            .modal-content {
                padding: 30px 20px;
            }
            .modal-content h2 {
                font-size: 22px;
            }
        }
        @media (min-width: 481px) and (max-width: 1024px) {
            .action-buttons {
                bottom: 25px;
                right: 25px;
            }
        }
    </style>
</head>
<body>

    <!-- Лоадер -->
    <div id="loader">
        <img id="loaderLogo" class="loader-logo" src="logo-light.png" alt="Логотип">
        <div class="loader-spinner"></div>
    </div>

    <!-- Кнопка переключения темы -->
    <button class="theme-toggle" id="themeToggle">
        <div class="toggle-track">
            <span class="toggle-icon" id="iconLeft">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
            </span>
            <span class="toggle-thumb" id="toggleThumb"></span>
            <span class="toggle-icon" id="iconRight">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </span>
        </div>
    </button>

    <!-- Контейнер слайдов -->
    <div class="slides-container" id="slidesContainer"></div>

    <!-- Блок дополнительных кнопок (правый нижний угол) -->
    <div class="action-buttons">
        <!-- Кнопка "Наверх" -->
        <button id="btnTop" class="btn-glass" aria-label="Наверх">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
            Наверх
        </button>
        <!-- Кнопка "Связаться" -->
        <button id="btnContact" class="btn-glass" aria-label="Связаться">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            Связаться
        </button>
    </div>

    <!-- Модальное окно с контактами -->
    <div id="modalOverlay">
        <div class="modal-content">
            <button class="close-btn" id="modalClose">&times;</button>
            <h2>Свяжитесь с нами</h2>
            <p>📞 <a href="tel:+78126470608">+7 812 647 0608</a></p>
            <p>✉️ <a href="mailto:kkmpos@yandex.ru">kkmpos@yandex.ru</a></p>
            <p>🌐 <a href="https://rhgroup.ru" target="_blank">rhgroup.ru</a></p>
            <p style="margin-top:20px; font-size:16px; opacity:0.7;">Нажмите вне окна или на крестик, чтобы закрыть</p>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. ОПРЕДЕЛЕНИЕ ПАПКИ
        // ============================================================
        function getFolder(theme) {
            const isMobile = window.innerWidth <= 768 && window.matchMedia('(orientation: portrait)').matches;
            const base = theme === 'light' ? 'light' : 'dark';
            return isMobile ? base + '-mobile' : base;
        }

        // ============================================================
        // 2. ПОСТРОЕНИЕ СЛАЙДОВ + ЛОАДЕР
        // ============================================================
        const totalSlides = 10;
        const slidesContainer = document.getElementById('slidesContainer');
        let imagesLoaded = 0;
        const loader = document.getElementById('loader');
        const loaderLogo = document.getElementById('loaderLogo');

        function updateLoaderLogo(theme) {
            loaderLogo.src = theme === 'dark' ? 'logo-dark.png' : 'logo-light.png';
        }

        const isDarkOnLoad = document.body.classList.contains('dark-theme');
        updateLoaderLogo(isDarkOnLoad ? 'dark' : 'light');

        setTimeout(() => loaderLogo.classList.add('loaded'), 300);

        const MIN_LOADER_DISPLAY = 2000;
        let loaderStartTime = Date.now();

        function buildSlides() {
            slidesContainer.innerHTML = '';
            for (let i = 1; i <= totalSlides; i++) {
                const slide = document.createElement('div');
                slide.className = 'slide';
                const img = document.createElement('img');
                img.src = `light/slide${i}.png`;
                img.alt = `Слайд ${i}`;

                img.onload = function() {
                    imagesLoaded++;
                    checkAndHideLoader();
                };
                if (img.complete) {
                    imagesLoaded++;
                    checkAndHideLoader();
                }

                slide.appendChild(img);
                slidesContainer.appendChild(slide);
            }
        }

        function checkAndHideLoader() {
            if (imagesLoaded >= totalSlides) {
                const elapsed = Date.now() - loaderStartTime;
                const remaining = Math.max(0, MIN_LOADER_DISPLAY - elapsed);
                setTimeout(() => hideLoader(), remaining);
            }
        }

        function hideLoader() {
            if (!loader.classList.contains('hidden')) {
                loader.classList.add('hidden');
                setTimeout(() => loader.style.display = 'none', 800);
            }
        }

        const fallbackTimeout = setTimeout(() => {
            if (!loader.classList.contains('hidden')) hideLoader();
        }, 8000);

        buildSlides();

        // ============================================================
        // 3. ПЛАВНОЕ ПОЯВЛЕНИЕ СЛАЙДОВ
        // ============================================================
        const slides = document.querySelectorAll('.slide');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        });
        slides.forEach(slide => observer.observe(slide));
        window.addEventListener('load', () => {
            slides[0].classList.add('visible');
            const allImgs = document.querySelectorAll('.slide img');
            let allLoaded = true;
            allImgs.forEach(img => { if (!img.complete) allLoaded = false; });
            if (allLoaded && imagesLoaded >= totalSlides) {
                const elapsed = Date.now() - loaderStartTime;
                const remaining = Math.max(0, MIN_LOADER_DISPLAY - elapsed);
                setTimeout(() => {
                    hideLoader();
                    clearTimeout(fallbackTimeout);
                }, remaining);
            }
        });

        // ============================================================
        // 4. ОБНОВЛЕНИЕ ИЗОБРАЖЕНИЙ
        // ============================================================
        const allImages = document.querySelectorAll('.slide img');
        let currentTheme = 'light';

        function updateImages(theme) {
            const folder = getFolder(theme);
            allImages.forEach((img, index) => {
                const num = index + 1;
                img.src = `${folder}/slide${num}.png`;
            });
            updateLoaderLogo(theme);
        }

        updateImages('light');

        // ============================================================
        // 5. ПЕРЕКЛЮЧЕНИЕ ТЕМЫ + АНИМАЦИЯ КНОПКИ
        // ============================================================
        const toggleBtn = document.getElementById('themeToggle');
        const body = document.body;

        function preloadImages(theme) {
            const folder = getFolder(theme);
            allImages.forEach((img, index) => {
                const num = index + 1;
                const url = `${folder}/slide${num}.png`;
                const newImg = new Image();
                newImg.src = url;
            });
        }

        let isAnimating = false;

        function toggleTheme() {
            if (isAnimating) return;
            isAnimating = true;

            toggleBtn.classList.add('animating');

            const isDark = body.classList.contains('dark-theme');
            const nextTheme = isDark ? 'light' : 'dark';

            preloadImages(nextTheme);
            body.classList.add('theme-switching');

            setTimeout(() => {
                updateImages(nextTheme);
                currentTheme = nextTheme;
                setTimeout(() => {
                    body.classList.remove('theme-switching');
                    toggleBtn.classList.remove('animating');
                    isAnimating = false;
                }, 600);
            }, 800);

            if (isDark) {
                body.classList.remove('dark-theme');
            } else {
                body.classList.add('dark-theme');
            }
        }

        toggleBtn.addEventListener('click', toggleTheme);

        // ============================================================
        // 6. КНОПКА "НАВЕРХ"
        // ============================================================
        const btnTop = document.getElementById('btnTop');
        let topVisible = false;

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            if (scrollY > 400 && !topVisible) {
                btnTop.classList.add('visible');
                topVisible = true;
            } else if (scrollY <= 400 && topVisible) {
                btnTop.classList.remove('visible');
                topVisible = false;
            }
        });

        btnTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            // пульсация
            btnTop.classList.add('pulse-on-click');
            setTimeout(() => btnTop.classList.remove('pulse-on-click'), 600);
        });

        // ============================================================
        // 7. КНОПКА "СВЯЗАТЬСЯ" – МОДАЛЬНОЕ ОКНО
        // ============================================================
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        const btnContact = document.getElementById('btnContact');

        function openModal() {
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        btnContact.addEventListener('click', () => {
            openModal();
            // пульсация
            btnContact.classList.add('pulse-on-click');
            setTimeout(() => btnContact.classList.remove('pulse-on-click'), 600);
        });

        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        // 8. АДАПТАЦИЯ ПРИ ПОВОРОТЕ
        // ============================================================
        function handleResize() {
            updateImages(currentTheme);
        }

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(handleResize, 300);
        });

        window.addEventListener('orientationchange', () => {
            setTimeout(handleResize, 500);
        });

        // ============================================================
        // 9. ЗАВЕРШЕНИЕ
        // ============================================================
        window.addEventListener('load', () => {
            allImages.forEach(img => img.style.opacity = '1');
            updateImages(currentTheme);
        });
    </script>
</body>
</html>
